name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './code[test]'

      - name: Validate external-source boundary
        run: python Standards/00_manifest/validate_sources.py

      - name: Run automated tests
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest code/tests

      - name: Validate public release
        run: python tools/validate_release.py

      - name: Verify SHA-256 manifest
        run: python tools/build_manifest.py --check
